[package]
name = "r200_uhf"
version = "0.6.0"
edition = "2024"
description = "Sans-IO serial protocol library for R200 UHF RFID readers"
license = "MIT"
repository = "https://github.com/oniram88/r200_uhf"

[dependencies]
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["io-util", "time"], optional = true }

# cli-only
clap = { version = "4", features = ["derive", "env"], optional = true }
anyhow = { version = "1", optional = true }
serialport = { version = "4", optional = true }
env_logger = { version = "0.11", optional = true }
ctrlc = { version = "3", optional = true }

[features]
default = []
sync = []
async = ["dep:tokio"]
cli = ["sync", "dep:clap", "dep:anyhow", "dep:serialport", "dep:env_logger", "dep:ctrlc"]
serde = ["dep:serde"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "time"] }
tokio-serial = "5.4.5"
serialport = "4"
env_logger = "0.11"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
semicolon_if_nothing_returned = "warn"
mod_module_files = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
wildcard_imports = "allow"
return_self_not_must_use = "allow"
suboptimal_flops = "allow"
missing_const_for_fn = "allow"
format_collect = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
future_not_send = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"

[[bin]]
name = "r200"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "async_poll"
required-features = ["async"]

[[example]]
name = "sync_poll"
required-features = ["sync"]
